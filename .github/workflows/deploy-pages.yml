name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify website directory structure
        run: |
          echo "=== Verificando estrutura do site em docs/website ==="
          test -f docs/website/index.html || { echo "ERRO: docs/website/index.html não encontrado!"; exit 1; }
          test -f docs/website/privacy.html || { echo "ERRO: docs/website/privacy.html não encontrado!"; exit 1; }
          test -f docs/website/terms.html || { echo "ERRO: docs/website/terms.html não encontrado!"; exit 1; }
          test -f docs/website/css/style.css || { echo "ERRO: docs/website/css/style.css não encontrado!"; exit 1; }
          test -f docs/website/assets/icon.png || { echo "ERRO: docs/website/assets/icon.png não encontrado!"; exit 1; }
          test -f docs/website/assets/dashboard.png || { echo "ERRO: docs/website/assets/dashboard.png não encontrado!"; exit 1; }
          ls -la docs/website/
          echo "Estrutura validada com sucesso."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact (docs/website only)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/website'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
